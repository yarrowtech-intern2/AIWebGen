# Render Blueprint (free plan): web service only. The database is an external
# Postgres (e.g. Neon free tier) whose connection string you paste as DATABASE_URL.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
#
# Free plan notes: the service sleeps after 15 min without traffic (first request
# after that takes ~1 min), and pre-deploy commands are not available, so
# migrations run at start.

services:
  - type: web
    name: agentwebbuilder
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # paste your Neon connection string when asked
      - key: AUTH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: anthropic-api
      - key: ANTHROPIC_API_KEY
        sync: false # prompted for in the dashboard on first deploy
      - key: AI_MODEL
        value: claude-opus-5-5
      - key: AI_EFFORT
        value: medium
      - key: AI_MAX_STEPS
        value: "40"
      - key: AI_FALLBACKS
        value: "on"
